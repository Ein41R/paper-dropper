# DeathDrop map configuration.
# Use /dd create <id> [display-name], then set locations in game.
homing-room: {}
maps: {}

# Custom item styling. Use Minecraft color codes such as &b or &l.
items:
  selector-name: "&b&lMap Selector"
  selector-lore: "&7Right-click to choose a map."
  compass-name: "&a&lCheckpoint Compass"
  compass-lore: "&7Right-click to return to your last checkpoint."

# The fallback item shown for maps without their own item-material.
# Examples: PAPER, DIAMOND, NETHER_STAR, FEATHER, FIREWORK_STAR
menu:
  sports:
    item-material: DIAMOND
  Aerostat:
    item-material: FEATHER
  item-material: PAPER
  item-name: "&6&l%map%"
  item-lore: "&7Click to enter this map."

# Each map can override menu.item-material with its own item-material:
# maps:
#   canyon:
#     item-material: DIAMOND

# Completion presentation. The teleport delay is measured in seconds.
completion:
  teleport-delay-seconds: 3
  finish-title: "&6&lMAP COMPLETE!"
  finish-subtitle: "&e%map%"
  homing-title: "&b&lHOMING ROOM"
  homing-subtitle: "&7Welcome back"
