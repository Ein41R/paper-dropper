name: DeathDrop
version: 1.0.0
main: com.sibyl.deathdrop.DeathDropPlugin
api-version: '26.3'
author: SIBYL
description: Map selection, checkpoint respawns, and death-drop progression.
commands:
  dd:
    description: Manage DeathDrop maps and items.
    usage: /dd <create|delete|setcheckpoint|setfinish|setitem|sethomingroom|finish|list|reload|give>
    permission: deathdrop.admin
permissions:
  deathdrop.admin:
    description: Manage DeathDrop maps.
    default: op
